name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x   # CHANGE to match your TargetFramework (net8.0 = 8.0.x, net9.0 = 9.0.x)

      - run: dotnet restore RaceDay.sln   # CHANGE if your .sln has a different name
      - run: dotnet build RaceDay.sln --no-restore -c Release
      - run: dotnet test RaceDay.sln --no-build -c Release
